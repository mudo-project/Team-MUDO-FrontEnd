name: Validate main PR source branch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

jobs:
  validate-source-branch:
    name: develop 브랜치에서만 main으로 PR 가능
    runs-on: ubuntu-latest

    steps:
      - name: Check PR source branch
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ] || [ "$HEAD_BRANCH" != "develop" ]; then
            echo "::error::main 브랜치에는 develop 브랜치에서만 PR을 올릴 수 있습니다."
            echo "현재 PR: $HEAD_REPOSITORY:$HEAD_BRANCH → main"
            exit 1
          fi

          echo "검증 완료: develop → main PR입니다."