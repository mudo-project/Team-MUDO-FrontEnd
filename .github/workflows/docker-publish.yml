# main에 확정된 코드를 운영용 Docker 이미지로 발행하는 workflow다.
name: Publish production Docker image

# develop 병합이 아닌 main 병합 직후에만 운영 이미지를 발행한다.
on:
  push:
    branches: [main]

# 소스 checkout에 필요한 최소 읽기 권한만 부여한다.
permissions:
  contents: read

jobs:
  publish:
    name: Build and push SHA image
    # GitHub가 제공하는 최신 Ubuntu runner에서 이미지를 빌드한다.
    runs-on: ubuntu-latest
    # Docker 빌드가 비정상적으로 오래 실행되는 것을 방지한다.
    timeout-minutes: 30
    # Docker Hub namespace와 repository를 조합해 공통 이미지 이름을 만든다.
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}

    steps:
      # main에 병합된 현재 commit의 소스 코드를 runner로 내려받는다.
      - name: Checkout source code
        uses: actions/checkout@v6

      # 이미지 이름과 빌드 환경변수가 누락된 경우 Docker Hub 로그인 전에 중단한다.
      - name: Validate publish configuration
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          test -n "$NEXT_PUBLIC_API_BASE_URL"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_REPOSITORY"

      # 계정 비밀번호 대신 GitHub Secret에 저장한 Read/Write PAT로 인증한다.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BuildKit cache와 플랫폼 지정 빌드를 사용할 수 있도록 Buildx를 준비한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 운영 API 주소를 주입해 linux/amd64 이미지를 만들고 commit SHA 태그로 push한다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          # latest 대신 불변 commit SHA를 사용해 배포 추적과 rollback이 가능하게 한다.
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # GitHub Actions cache를 재사용해 이후 Docker 빌드 시간을 줄인다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
